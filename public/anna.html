      h1 {

      .secret-button {
        position: fixed;
        right: 24px;
        bottom: 24px;

        cursor: pointer;

      .secret-button:hover {
        border-color: #ededed;
        color: #d6d6d6;
      }

      .secret-button:focus-visible {
